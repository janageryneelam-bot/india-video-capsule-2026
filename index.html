<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>India Video Capsule 2026</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #f7f5f0;
      color: #111;
    }

    .hero {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 40px 20px;
    }

    .container {
      max-width: 850px;
    }

    .eyebrow {
      font-size: 14px;
      letter-spacing: 3px;
      text-transform: uppercase;
      margin-bottom: 25px;
      font-weight: bold;
    }

    h1 {
      font-size: clamp(45px, 9vw, 100px);
      line-height: 0.95;
      letter-spacing: -4px;
      margin-bottom: 25px;
    }

    .tagline {
      font-size: clamp(22px, 4vw, 38px);
      margin-bottom: 25px;
    }

    .description {
      max-width: 650px;
      margin: 0 auto 40px;
      font-size: 18px;
      line-height: 1.6;
      color: #555;
    }

    .cta {
      display: inline-block;
      background: #111;
      color: white;
      padding: 18px 30px;
      text-decoration: none;
      font-weight: bold;
      border-radius: 4px;
      letter-spacing: 1px;
    }

    .freeze {
      margin-top: 25px;
      font-size: 14px;
      color: #777;
    }
  </style>
</head>

<body>

  <section class="hero">

    <div class="container">

      <div class="eyebrow">
        India · 2026
      </div>

      <h1>
        INDIA<br>
        VIDEO<br>
        CAPSULE
      </h1>

      <div class="tagline">
        Your 2026 Moment.<br>
        Frozen in Time.
      </div>

      <p class="description">
        A digital time capsule preserving the people,
        achievements, brands, startups and moments
        that made India’s 2026.
      </p>

      <a href="claim.html" class="cta">
        PRESERVE MY 2026 MOMENT
      </a>

      <div class="freeze">
        Entries close permanently on December 31, 2026.
      </div>

    </div>

  </section>

</body>
</html>
